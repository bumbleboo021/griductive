name: Deploy browser game

on:
  workflow_dispatch:
  push:
    branches: [web-deploy]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-web.txt
      - name: Install build dependencies
        run: python -m pip install -r requirements-web.txt
      - name: Build browser package
        run: python -u scripts/build_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web-src/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish game
        id: deployment
        uses: actions/deploy-pages@v4
